name: Build Microbit ThingSpeak Bluetooth Gateway EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "microbit-thingspeak-bluetooth/**"
      - ".github/workflows/build-microbit-thingspeak-bluetooth.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller bleak requests
      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Microbit-ThingSpeak-Bluetooth-Gateway microbit-thingspeak-bluetooth/microbit_thingspeak_bluetooth_gateway.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Microbit-ThingSpeak-Bluetooth-Gateway-Windows
          path: dist/Microbit-ThingSpeak-Bluetooth-Gateway.exe
          if-no-files-found: error
          retention-days: 30
